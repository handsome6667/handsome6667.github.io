        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column; /* 让标题和按钮垂直排列 */
        justify-content: center;
        align-items: center;
        background-color: #f5f5f5;
      }
      h1 {
        color: purple;
        font-size: 50px;
        background-color: red;

        background-color: #ff4444;
        color: white;
        border: none;
        border-radius: 8px;

        margin-top: 30px;
      }

        background-color: #cc0000;
      }
